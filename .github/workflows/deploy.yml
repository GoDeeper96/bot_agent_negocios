name: Deploy Bot Agent

on:
  push:
    branches:
      - main      # deploys to prod
      - develop   # deploys to dev

  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

jobs:
  deploy:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set stage from branch
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "stage=prod" >> $GITHUB_OUTPUT
          else
            echo "stage=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --config-env ${{ steps.stage.outputs.stage }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Print webhook URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name bot-agent-${{ steps.stage.outputs.stage }} \
            --region us-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='WebhookUrl'].OutputValue" \
            --output text
